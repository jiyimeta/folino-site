title: folino
email: contact@harmolo.com
url: https://folino.app

# Harmolo, who makes folino, keeps its own site; the footer links to it, and the privacy policy to Harmolo's own.
harmolo_url: https://harmolo.com

# Overriding `exclude` replaces Jekyll's defaults, so the usual entries are
# repeated here alongside the repo's own README.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
