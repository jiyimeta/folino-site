# folino's FAQ: the full list on /faq/<locale>/ (_layouts/faq.html),
# and the entries marked `featured` on the home page as well. One list feeds both,
# so a question is written - and translated - once.
#
# `id` is the question's anchor on the FAQ page (/faq/ja/#sign-in). The app
# links to these, so an id is a published URL: never rename or reuse one, and
# never derive it from the question text, which changes with translation and
# rewording. An entry without text for a locale is skipped on that locale's pages.
#
# Answers are Markdown. Links inside them point at the same locale's pages, and
# the names of app commands and settings are quoted the way that locale's app
# spells them.

