# Locales in language-switcher order. `code` is used as the <html lang> value
# and as the key into every other file in _data.
#
# `match` lists extra BCP 47 tags that should resolve to this locale when the
# English home page reads the visitor's browser languages. The lowercased `code`
# always matches, and matching falls back to shorter prefixes (`ja-JP` finds
# `ja`), so `match` is only needed where the tag and the code differ: the
# Chinese scripts have their own region codes.
- code: en
  name: English
- code: ja
  name: 日本語
- code: ko
  name: 한국어
- code: zh-Hans
  name: 简体中文
  # Bare `zh` lands here, so it must not be listed under zh-Hant as well.
  match: [zh-cn, zh-sg, zh]
- code: zh-Hant
  name: 繁體中文
  match: [zh-tw, zh-hk, zh-mo]
